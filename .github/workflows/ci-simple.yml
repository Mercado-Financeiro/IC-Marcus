name: Simple CI Pipeline

on:
  push:
    branches: [main, develop, 'test/**', 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  # Basic lint check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      
      - name: Check with Ruff (errors only)
        run: ruff check src tests --select=E9,F63,F7,F82 --show-source || true
      
      - name: Check Black formatting
        run: black --check src tests --diff || true

  # Basic unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
      
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run basic unit tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          export MLFLOW_TRACKING_URI="file://./artifacts/mlruns"
          pytest tests/unit/test_models/test_xgb_base.py -v --tb=short || true
          pytest tests/unit/test_determinism.py -v --tb=short || true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            .coverage
            htmlcov/
            pytest-report.xml
          retention-days: 7